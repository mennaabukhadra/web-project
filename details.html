<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #fff7fa;
      color: #7a3659;
    }

    .details-container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }

    h1 {
      color: #b84f7d;
    }

    p {
      font-size: 1.1em;
      color: #555;
    }

    #productImage {
      width: 300px; 
      height: auto;
      margin: 0 auto;
      display: block;
    }

    .product-details {
      text-align: center;
      padding: 20px;
    }

    .product-details h1 {
      color: #7a3659;
    }

    .product-details p {
      font-size: 1.2em;
      color: #777;
    }

    .btn-add-to-cart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 142px;
      min-height: 44px;
      padding: 0 20px;
      background-color: #b84f7d;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1em;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .btn-add-to-cart:hover {
      background-color: #96395f; 
      transform: translateY(-3px); 
    }

    .btn-add-to-cart:active {
      transform: translateY(2px); 
    }

    body {
      background-color: #96395f;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .btn-add-to-favorites {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 142px;
  min-height: 44px;
  padding: 0 20px;
  background-color: #b84f7d;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 1.1em;
  text-align: center;
  margin-top: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  transition: background-color 0.3s ease, transform 0.3s ease;
}

.btn-add-to-favorites:hover {
      background-color: #96395f; 
  transform: translateY(-3px); 
}

.btn-add-to-favorites:active {
  transform: translateY(2px); 
}

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #7a3659;
      text-decoration: none;
      font-weight: bold;
    }

    .theme-toggle { margin-left: 12px; min-height: 36px; padding: 0 12px; border: 1px solid #7a3659; border-radius: 6px; background: transparent; color: #7a3659; cursor: pointer; }
    body.dark-mode { background: #291923; }
    body.dark-mode .product-details { color: #edf5f5; }
    body.dark-mode .product-details h1 { color: #dff5f5; }
    body.dark-mode .product-details p { color: #d2e0e1; }
    body.dark-mode .back-link, body.dark-mode .theme-toggle { color: #dff5f5; border-color: #dff5f5; }

    /* Palette matched to the blush-pink hero image. */
    body { background-color: #fff8f5; color: #573b39; }
    h1, .product-details h1, .back-link { color: #7b5452; }
    .theme-toggle { border-color: #7b5452; color: #7b5452; }
    .btn-add-to-cart, .btn-add-to-favorites { background-color: #b56f68; }
    .btn-add-to-cart:hover, .btn-add-to-favorites:hover { background-color: #965852; }
    body.dark-mode { background: #2d2020; }
    body.dark-mode .product-details h1, body.dark-mode .back-link, body.dark-mode .theme-toggle { color: #fff3ef; border-color: #fff3ef; }
  </style>
</head>
<body>
    <div class="product-details">
        <a class="back-link" href="product.html">&larr; Back to products</a>
        <button class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        <img id="productImage" src="" alt="Product Image" />
        <h1 id="productTitle"></h1>
        <p id="productDesc"></p>
        <p id="productPrice"></p>
        
        <!-- Rating stars -->
        <div id="productRating">
            <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
        </div>

        <a href="#" class="btn-add-to-cart">Add to Cart</a>
        <a href="#" class="btn-add-to-favorites">Add to Favorites</a>

    </div>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title');
        const desc = urlParams.get('desc');
        const image = urlParams.get('image');
        const price = urlParams.get('price');

        
        document.getElementById('productTitle').innerText = title;
        document.getElementById('productDesc').innerText = desc;
        document.getElementById('productImage').src = image && image.includes('/') ? image : `assets/images/products/${image}`;
        document.getElementById('productPrice').innerText = price;  

     
        const stars = document.getElementById('productRating').getElementsByTagName('span');
        let rating = 4;
        for (let i = 0; i < rating; i++) {
            stars[i].style.color = 'gold';
        }
        
        document.querySelector('.btn-add-to-favorites').addEventListener('click', function(e) {
    e.preventDefault();  
    alert('Added to favorites !');
});
    </script>
    <script src="js/theme.js"></script>
</body>
</html>
