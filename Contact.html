<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Care | Contact</title>
    <link rel="stylesheet" href="css/Contact.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Skin Care</div>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="Contact.html" class="active">Contact Us</a></li>
                <li><button class="theme-toggle" type="button" aria-pressed="false">Dark mode</button></li>
            </ul>
        </nav>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <h1>Contact Us</h1>
            <p class="form-note">Have a question about a product? Send us a message.</p>
            <form action="#" method="POST" class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Write your message here" rows="4" required></textarea>

                <button type="submit">Send</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Skin Care. Student project.</p>
    </footer>
    <script src="js/theme.js"></script>
</body>
</html>
